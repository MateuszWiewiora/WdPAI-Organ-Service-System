<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Architektura frontend–backend z JavaScript Fetch API</title>
  <desc id="description">Schemat przedstawia przepływ żądania z interfejsu użytkownika przez JavaScript Fetch API do backendu PHP i bazy danych oraz powrót odpowiedzi JSON do interfejsu.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 40px; font-weight: 760; fill: #0F172A; letter-spacing: -0.8px; }
      .subtitle { font-size: 18px; font-weight: 450; fill: #64748B; }
      .column-title { font-size: 22px; font-weight: 750; fill: #FFFFFF; }
      .column-kicker { font-size: 13px; font-weight: 700; fill: #DBEAFE; letter-spacing: 1.6px; }
      .card-title { font-size: 19px; font-weight: 720; fill: #0F172A; }
      .card-body { font-size: 15px; font-weight: 450; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; font-weight: 600; fill: #1E3A8A; }
      .flow-title { font-size: 16px; font-weight: 750; }
      .flow-body { font-size: 13px; font-weight: 500; fill: #64748B; }
      .badge { font-size: 14px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .footer-title { font-size: 16px; font-weight: 750; fill: #0F172A; }
      .footer-body { font-size: 14px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="40" r="210" fill="#C7D2FE" opacity="0.24"/>
  <circle cx="90" cy="840" r="180" fill="#BFDBFE" opacity="0.22"/>

  <g class="font">
    <text x="100" y="82" class="title">Architektura frontend–backend z Fetch API</text>
    <text x="100" y="116" class="subtitle">Asynchroniczna komunikacja bez przeładowania całej strony</text>

    <!-- Frontend column -->
    <g filter="url(#shadow)">
      <rect x="100" y="160" width="450" height="570" rx="28" fill="#FFFFFF"/>
      <path d="M128 160 H522 A28 28 0 0 1 550 188 V255 H100 V188 A28 28 0 0 1 128 160 Z" fill="url(#frontend)"/>
    </g>
    <text x="140" y="198" class="column-kicker">WARSTWA KLIENTA</text>
    <text x="140" y="230" class="column-title">Frontend — przeglądarka</text>

    <rect x="140" y="292" width="370" height="106" rx="18" fill="#EFF6FF" stroke="#BFDBFE"/>
    <rect x="160" y="314" width="44" height="44" rx="12" fill="#DBEAFE"/>
    <path d="M171 326h22v16h-22z M171 331h22" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round"/>
    <text x="222" y="330" class="card-title">Interfejs użytkownika</text>
    <text x="222" y="356" class="card-body">HTML + CSS</text>
    <text x="222" y="378" class="card-body">kliknięcie / wysłanie formularza</text>

    <rect x="140" y="425" width="370" height="155" rx="18" fill="#EEF2FF" stroke="#C7D2FE"/>
    <rect x="160" y="447" width="44" height="44" rx="12" fill="#E0E7FF"/>
    <text x="182" y="475" text-anchor="middle" font-size="18" font-weight="800" fill="#4F46E5">JS</text>
    <text x="222" y="463" class="card-title">Logika JavaScript</text>
    <text x="222" y="489" class="card-body">tworzy i wysyła żądanie HTTP</text>
    <rect x="160" y="512" width="330" height="44" rx="10" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="177" y="539" class="mono">fetch('/api/projects')</text>

    <rect x="140" y="607" width="370" height="85" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="165" y="641" class="card-title">Aktualizacja widoku</text>
    <text x="165" y="669" class="card-body">DOM wyświetla dane bez odświeżania strony</text>

    <!-- Communication lane -->
    <rect x="612" y="206" width="300" height="462" rx="28" fill="#FFFFFF" stroke="#DCE3F0" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="762" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#64748B" letter-spacing="1.4">KOMUNIKACJA HTTP(S)</text>

    <circle cx="650" cy="313" r="18" fill="#2563EB"/>
    <text x="650" y="314" class="badge">1</text>
    <text x="681" y="307" class="flow-title" fill="#1D4ED8">Żądanie</text>
    <text x="681" y="330" class="flow-body">GET / POST / PUT / DELETE</text>
    <path d="M510 357 C610 357 618 357 886 357" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="654" y="347" width="174" height="30" rx="15" fill="#EFF6FF"/>
    <text x="741" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">nagłówki + body JSON</text>

    <circle cx="650" cy="493" r="18" fill="#059669"/>
    <text x="650" y="494" class="badge">4</text>
    <text x="681" y="487" class="flow-title" fill="#047857">Odpowiedź</text>
    <text x="681" y="510" class="flow-body">status HTTP + dane JSON</text>
    <path d="M886 537 C720 537 650 537 510 537" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <rect x="654" y="527" width="174" height="30" rx="15" fill="#ECFDF5"/>
    <text x="741" y="547" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">np. 200 OK + JSON</text>

    <rect x="654" y="588" width="216" height="50" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
    <path d="M676 612h16 M681 605l-7 7 7 7 M704 605l7 7-7 7" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="724" y="617" font-size="14" font-weight="650" fill="#475569">format wymiany: JSON</text>

    <!-- Backend column -->
    <g filter="url(#shadow)">
      <rect x="974" y="160" width="526" height="570" rx="28" fill="#FFFFFF"/>
      <path d="M1002 160 H1472 A28 28 0 0 1 1500 188 V255 H974 V188 A28 28 0 0 1 1002 160 Z" fill="url(#backend)"/>
    </g>
    <text x="1014" y="198" class="column-kicker" fill="#D1FAE5">WARSTWA SERWERA</text>
    <text x="1014" y="230" class="column-title">Backend — API</text>

    <circle cx="1018" cy="313" r="18" fill="#2563EB"/>
    <text x="1018" y="314" class="badge">2</text>
    <rect x="1052" y="285" width="408" height="80" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="1078" y="318" class="card-title">Routing / kontroler API</text>
    <text x="1078" y="344" class="card-body">odbiera żądanie i waliduje dane</text>

    <path d="M1256 365v32" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <rect x="1052" y="405" width="408" height="80" rx="16" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="1078" y="438" class="card-title">Serwis / logika biznesowa</text>
    <text x="1078" y="464" class="card-body">realizuje reguły i przygotowuje wynik</text>

    <path d="M1256 485v32" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <circle cx="1018" cy="561" r="18" fill="#059669"/>
    <text x="1018" y="562" class="badge">3</text>
    <rect x="1052" y="525" width="250" height="80" rx="16" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="1078" y="558" class="card-title">Repozytorium</text>
    <text x="1078" y="584" class="card-body">odczyt / zapis danych</text>

    <!-- Database icon -->
    <ellipse cx="1385" cy="544" rx="56" ry="19" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/>
    <path d="M1329 544v58c0 11 25 19 56 19s56-8 56-19v-58" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
    <path d="M1329 573c0 11 25 19 56 19s56-8 56-19" fill="none" stroke="#0F766E" stroke-width="2"/>
    <text x="1385" y="655" text-anchor="middle" class="card-title">Baza danych</text>
    <path d="M1302 565h25" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <!-- Footer principles -->
    <rect x="100" y="775" width="1400" height="84" rx="22" fill="#FFFFFF" stroke="#DCE3F0"/>
    <circle cx="138" cy="817" r="19" fill="#DBEAFE"/>
    <path d="M130 817l5 5 11-12" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="811" class="footer-title">Rozdzielenie odpowiedzialności</text>
    <text x="172" y="835" class="footer-body">Frontend prezentuje dane i obsługuje interakcje</text>
    <line x1="570" y1="798" x2="570" y2="838" stroke="#E2E8F0"/>
    <circle cx="610" cy="817" r="19" fill="#D1FAE5"/>
    <path d="M603 817h14 M610 810v14" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <text x="644" y="811" class="footer-title">Backend chroni reguły i dane</text>
    <text x="644" y="835" class="footer-body">API zwraca przewidywalne statusy HTTP i JSON</text>
    <line x1="1050" y1="798" x2="1050" y2="838" stroke="#E2E8F0"/>
    <circle cx="1090" cy="817" r="19" fill="#E0E7FF"/>
    <path d="M1082 817h16 M1086 811l-6 6 6 6 M1094 811l6 6-6 6" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1124" y="811" class="footer-title">Fetch API łączy obie warstwy</text>
    <text x="1124" y="835" class="footer-body">komunikacja jest asynchroniczna i niezależna</text>
  </g>
</svg>
